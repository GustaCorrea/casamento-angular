<div
  class="bg-white rounded-lg shadow-sm overflow-hidden flex flex-col transition-transform hover:-translate-y-1 hover:shadow-md"
  style="height: 350px"
>
  <img
    [src]="
      gift.imageUrl
        ? 'https://api.marialauraepedro.com.br' + gift.imageUrl
        : 'assets/images/placeholder.jpg'
    "
    alt="Foto do presente"
    class="w-full h-48 object-cover"
  />

  <div class="p-4 flex flex-col flex-1">
    <h3 class="font-semibold text-lg" style="color: #2c1f14">{{ gift.name }}</h3>
    <p class="text-sm mt-1 line-clamp-2" style="color: #7a6259">{{ gift.description }}</p>

    <div class="mt-auto">
      <div class="flex justify-between items-center mb-3">
        <span class="text-sm font-medium" style="color: #8a7570">Valor da Cota:</span>
        <span class="font-semibold text-lg" style="color: #8b5e52"
          >R$ {{ gift.value | number: '1.2-2' }}</span
        >
      </div>
      <button
        (click)="contribute()"
        class="w-full py-2.5 text-white rounded-md transition-colors font-medium hover:opacity-90"
        style="background: #8b5e52"
      >
        Presentear
      </button>
    </div>
  </div>
</div>
