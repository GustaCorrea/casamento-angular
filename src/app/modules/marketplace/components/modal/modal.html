<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
  <div
    class="relative w-full max-w-md rounded-2xl overflow-hidden"
    style="background: white; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3)"
  >
    <!-- Botão Fechar -->
    <button
      (click)="closeModal()"
      class="absolute top-3 right-3 z-10 flex items-center justify-center rounded-full transition-colors"
      style="
        width: 32px;
        height: 32px;
        background: rgba(255, 255, 255, 0.85);
        color: #3b2a24;
        cursor: pointer;
        border: none;
      "
    >
      <svg style="width: 16px; height: 16px" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>

    <div class="overflow-hidden" style="height: 176px">
      <img
        [src]="
          gift?.imageUrl
            ? 'http://localhost:8080' + gift!.imageUrl
            : 'assets/images/placeholder.jpg'
        "
        alt="{{ gift?.name }}"
        class="w-full h-full object-cover"
      />
    </div>

    <!-- Conteúdo -->
    <div class="flex flex-col gap-5 p-6" style="background: white">
      <div>
        <h2
          class="mb-1"
          style="
            font-size: 22px;
            font-family: Georgia, serif;
            font-weight: 600;
            color: #3b2a24;
            margin: 0 0 4px;
          "
        >
          {{ gift?.name }}
        </h2>
        <p style="font-size: 15px; color: #8b5e52; font-weight: 500; margin: 0">
          Valor da Cota: R$ {{ gift?.value | number: '1.2-2' }}
        </p>
      </div>

      <form (ngSubmit)="submitContribution()" class="flex flex-col gap-3">
        <!-- Input Nome -->
        <input
          type="text"
          [value]="donorName"
          name="donorName"
          required
          (input)="donorName = $any($event.target).value"
          class="w-full rounded-xl placeholder:text-[#8a7570] focus:outline-none focus:ring-1"
          style="
            box-sizing: border-box;
            background: #faf5f3;
            border: 1px solid #e8d9d3;
            padding: 14px 16px;
            font-size: 14px;
            color: #3b2a24;
          "
          placeholder="Seu nome completo"
        />

        <!-- Input Mensagem -->
        <textarea
          [value]="message"
          name="message"
          (input)="message = $any($event.target).value"
          rows="3"
          class="w-full rounded-xl placeholder:text-[#8a7570] focus:outline-none focus:ring-1 resize-none"
          style="
            box-sizing: border-box;
            background: #faf5f3;
            border: 1px solid #e8d9d3;
            padding: 14px 16px;
            font-size: 14px;
            color: #3b2a24;
            font-family: inherit;
          "
          placeholder="Deixe uma mensagem carinhosa (opcional)"
        ></textarea>

        <!-- Botão de Ação -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full font-medium text-white transition-all active:scale-[0.98] mt-2 disabled:opacity-70 flex justify-center items-center"
          style="
            background: #8b5e52;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 15px;
            cursor: pointer;
          "
        >
          <span *ngIf="!isLoading">Ir para o Pagamento</span>
          <span *ngIf="isLoading" class="flex items-center gap-2">
            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            Processando...
          </span>
        </button>
      </form>
    </div>
  </div>
</div>
