<div class="adm-guests-container">
  <h2>Gerenciar Convidados</h2>
  
  <div *ngIf="isLoading">
    <p>Carregando...</p>
  </div>
  
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <table *ngIf="!isLoading && guests.length > 0">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let guest of guests">
        <td>{{ guest.name }}</td>
        <td>
          <button>Editar</button>
          <button>Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!isLoading && guests.length === 0 && !errorMessage">
    <p>Nenhum convidado encontrado.</p>
  </div>
</div>
