<div class="w-full max-w-6xl mx-auto p-8">
  <div class="mb-8">
    <p class="text-xs text-gray-400 uppercase tracking-widest mb-1 font-semibold">PAINEL</p>
    <h2 class="text-4xl font-serif text-brand-dark">Cronograma</h2>
  </div>

  <div
    class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm mb-8 transition-all duration-300"
  >
    <div class="flex items-center justify-between" [ngClass]="{ 'mb-6': isFormOpen }">
      <h3 class="text-lg font-medium text-brand-dark">Cadastrar Evento</h3>

      <button
        (click)="toggleForm()"
        [ngClass]="
          isFormOpen
            ? 'bg-gray-100 text-gray-600 hover:bg-gray-200'
            : 'bg-[#8c6b5d] hover:bg-[#735548] text-white'
        "
        class="px-5 py-2 rounded-md transition-colors flex items-center gap-2 shadow-sm font-medium text-sm cursor-pointer"
      >
        <svg
          *ngIf="!isFormOpen"
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 4v16m8-8H4"
          ></path>
        </svg>
        <svg
          *ngIf="isFormOpen"
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
        {{ isFormOpen ? 'Cancelar' : 'Novo' }}
      </button>
    </div>

    <div *ngIf="isFormOpen" class="space-y-4">
      <div class="flex flex-col md:flex-row gap-4 items-start md:items-center">
        <div class="relative w-full md:w-36">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg
              class="w-4 h-4 text-gray-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
          </div>
          <input
            type="time"
            [(ngModel)]="timeInput"
            class="w-full pl-9 pr-4 py-2.5 bg-[#fdfbf9] border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-[#8c6b5d] text-sm text-brand-dark"
          />
        </div>

        <input
          type="text"
          [(ngModel)]="newEvent.title"
          placeholder="Nome do evento"
          class="w-full md:flex-1 px-4 py-2.5 bg-[#fdfbf9] border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-[#8c6b5d] text-sm text-brand-dark placeholder-gray-400"
        />
        <input
          type="text"
          [(ngModel)]="newEvent.location"
          placeholder="Local do evento"
          class="w-full md:flex-1 px-4 py-2.5 bg-[#fdfbf9] border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-[#8c6b5d] text-sm text-brand-dark placeholder-gray-400"
        />
      </div>

      <div class="flex flex-col md:flex-row gap-4 items-start md:items-center pt-2">
        <select
          [(ngModel)]="newEvent.type"
          class="w-full md:w-48 px-4 py-2.5 bg-[#fdfbf9] border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-[#8c6b5d] text-sm text-brand-dark"
        >
          <option value="CERIMONIA">Cerimônia</option>
          <option value="RECEPCAO">Recepção</option>
          <option value="JANTAR">Jantar</option>
          <option value="CELEBRACAO">Celebração</option>
        </select>
        <input
          type="text"
          [(ngModel)]="newEvent.description"
          placeholder="Descrição curta (opcional)"
          class="w-full md:flex-1 px-4 py-2.5 bg-[#fdfbf9] border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-[#8c6b5d] text-sm text-brand-dark placeholder-gray-400"
        />
        <button
          (click)="saveEvent()"
          class="w-full md:w-auto px-4 py-2.5 bg-[#8c6b5d] hover:bg-[#735548] text-white rounded-md shadow-sm transition-colors flex justify-center items-center cursor-pointer"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            ></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-6">
    <div class="relative w-full md:w-96">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          ></path>
        </svg>
      </div>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Buscar evento..."
        class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-md bg-[#f9f8f6] focus:outline-none focus:ring-1 focus:ring-[#8c6b5d] text-sm"
      />
    </div>

    <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
      <button
        (click)="setType('Todos')"
        [ngClass]="
          selectedType === 'Todos'
            ? 'bg-[#8c6b5d] text-white border-transparent'
            : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'
        "
        class="px-4 py-1.5 text-sm rounded-md border shadow-sm transition"
      >
        Todos
      </button>
      <button
        (click)="setType('CERIMONIA')"
        [ngClass]="
          selectedType === 'CERIMONIA'
            ? 'bg-[#8c6b5d] text-white border-transparent'
            : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'
        "
        class="px-4 py-1.5 text-sm rounded-md border shadow-sm transition"
      >
        Cerimônia
      </button>
      <button
        (click)="setType('RECEPCAO')"
        [ngClass]="
          selectedType === 'RECEPCAO'
            ? 'bg-[#8c6b5d] text-white border-transparent'
            : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'
        "
        class="px-4 py-1.5 text-sm rounded-md border shadow-sm transition"
      >
        Recepção
      </button>
      <button
        (click)="setType('JANTAR')"
        [ngClass]="
          selectedType === 'JANTAR'
            ? 'bg-[#8c6b5d] text-white border-transparent'
            : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'
        "
        class="px-4 py-1.5 text-sm rounded-md border shadow-sm transition"
      >
        Jantar
      </button>
      <button
        (click)="setType('CELEBRACAO')"
        [ngClass]="
          selectedType === 'CELEBRACAO'
            ? 'bg-[#8c6b5d] text-white border-transparent'
            : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'
        "
        class="px-4 py-1.5 text-sm rounded-md border shadow-sm transition"
      >
        Celebração
      </button>
    </div>
  </div>

  <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm whitespace-nowrap">
        <thead
          class="bg-[#f9f8f6] text-gray-500 border-b border-gray-200 uppercase text-xs tracking-wider"
        >
          <tr>
            <th class="px-6 py-4 font-medium">Horário</th>
            <th class="px-6 py-4 font-medium">Evento</th>
            <th class="px-6 py-4 font-medium">Local</th>
            <th class="px-6 py-4 font-medium">Tipo</th>
            <th class="px-6 py-4 font-medium text-center">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let event of filteredEvents"
            class="border-b border-gray-100 hover:bg-white/50 transition-colors"
          >
            <td class="py-4 px-6 text-sm text-[#8c6b5d] font-medium">
              <span *ngIf="editingId !== event.id">{{ event.eventDate | date: 'HH:mm' }}</span>
              <div *ngIf="editingId === event.id" class="relative w-24">
                <div class="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
                  <svg
                    class="w-3 h-3 text-gray-400"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                    ></path>
                  </svg>
                </div>
                <input
                  type="time"
                  [(ngModel)]="editTimeInput"
                  class="w-full border border-[#e5dcd3] bg-[#fdfbf9] rounded-md pl-2 pr-6 py-1.5 text-sm outline-none focus:border-[#8c6b5d]"
                />
              </div>
            </td>

            <td class="py-4 px-6 text-sm text-gray-800">
              <span *ngIf="editingId !== event.id">{{ event.title }}</span>
              <input
                *ngIf="editingId === event.id"
                type="text"
                [(ngModel)]="editedEvent.title"
                class="w-full border border-[#e5dcd3] bg-[#fdfbf9] rounded-md px-3 py-1.5 text-sm outline-none focus:border-[#8c6b5d]"
              />
            </td>

            <td class="py-4 px-6 text-sm text-gray-600">
              <span *ngIf="editingId !== event.id">{{ event.location }}</span>
              <input
                *ngIf="editingId === event.id"
                type="text"
                [(ngModel)]="editedEvent.location"
                class="w-full border border-[#e5dcd3] bg-[#fdfbf9] rounded-md px-3 py-1.5 text-sm outline-none focus:border-[#8c6b5d]"
              />
            </td>

            <td class="py-4 px-6 text-sm">
              <span
                *ngIf="editingId !== event.id"
                class="px-3 py-1 bg-[#fcf9f6] text-[#8c6b5d] rounded-full text-xs border border-[#f5ebe0]"
              >
                {{ event.type | titlecase }}
              </span>
              <select
                *ngIf="editingId === event.id"
                [(ngModel)]="editedEvent.type"
                class="w-full border border-[#e5dcd3] bg-[#fdfbf9] rounded-md px-2 py-1.5 text-sm outline-none focus:border-[#8c6b5d]"
              >
                <option value="CERIMONIA">Cerimônia</option>
                <option value="RECEPCAO">Recepção</option>
                <option value="JANTAR">Jantar</option>
                <option value="CELEBRACAO">Celebração</option>
              </select>
            </td>

            <td class="py-4 px-6 text-sm flex justify-center gap-2">
              <ng-container *ngIf="editingId !== event.id">
                <button
                  (click)="startEditing(event)"
                  class="flex items-center justify-center w-8 h-8 bg-[#f5ebe0] text-[#8c6b5d] hover:bg-[#e6d5c3] rounded transition-colors cursor-pointer"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
                    />
                  </svg>
                </button>
                <button
                  (click)="deleteEvent(event)"
                  class="flex items-center justify-center w-8 h-8 bg-[#ffe4e1] text-[#cd5c5c] hover:bg-[#ffcccb] rounded transition-colors cursor-pointer"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                    />
                  </svg>
                </button>
              </ng-container>

              <ng-container *ngIf="editingId === event.id">
                <button
                  (click)="saveEdit()"
                  class="flex items-center justify-center w-8 h-8 text-green-600 bg-green-50 border border-green-100 hover:bg-green-100 rounded transition-colors cursor-pointer"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M5 13l4 4L19 7"
                    ></path>
                  </svg>
                </button>
                <button
                  (click)="cancelEdit()"
                  class="flex items-center justify-center w-8 h-8 text-red-500 bg-red-50 border border-red-100 hover:bg-red-100 rounded transition-colors cursor-pointer"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M6 18L18 6M6 6l12 12"
                    ></path>
                  </svg>
                </button>
              </ng-container>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
