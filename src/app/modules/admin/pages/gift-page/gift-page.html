<div class="w-full max-w-6xl mx-auto">
  <div class="mb-8">
    <p class="text-xs text-gray-400 uppercase tracking-widest mb-1 font-semibold">PAINEL</p>
    <h2 class="text-4xl font-serif text-brand-dark">Presentes</h2>
  </div>

  <div
    class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm mb-8 transition-all duration-300"
  >
    <div class="flex items-center justify-between" [ngClass]="{ 'mb-6': isFormOpen }">
      <h3 class="text-lg font-medium text-brand-dark">Cadastrar Presente</h3>

      <button
        (click)="toggleForm()"
        [ngClass]="
          isFormOpen
            ? 'bg-gray-100 text-gray-600 hover:bg-gray-200'
            : 'bg-[#8c6b5d] hover:bg-[#735548] text-white'
        "
        class="px-5 py-2 rounded-md transition-colors flex items-center gap-2 shadow-sm font-medium text-sm"
      >
        <svg
          *ngIf="!isFormOpen"
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 4v16m8-8H4"
          ></path>
        </svg>
        <svg
          *ngIf="isFormOpen"
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>

        {{ isFormOpen ? 'Cancelar' : 'Novo' }}
      </button>
    </div>

    <div *ngIf="isFormOpen" class="space-y-4">
      <!-- Primeira Linha: Nome, Categoria, Valor e Botão de Salvar -->
      <div class="flex flex-col md:flex-row gap-4 items-start md:items-center">
        <input
          type="text"
          [(ngModel)]="newGift.name"
          placeholder="Nome do presente"
          class="w-full md:flex-1 px-4 py-2.5 bg-[#fdfbf9] border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-[#8c6b5d] text-sm text-brand-dark placeholder-gray-400"
        />

        <select
          [(ngModel)]="newGift.type"
          class="w-full md:w-48 px-4 py-2.5 bg-[#fdfbf9] border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-[#8c6b5d] text-sm text-brand-dark"
        >
          <option value="Casa">Casa</option>
          <option value="Viagem">Viagem</option>
          <option value="Experiência">Experiência</option>
          <option value="Eletrodoméstico">Eletrodoméstico</option>
        </select>

        <div class="relative w-full md:w-40">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <span class="text-gray-500 text-sm font-medium">R$</span>
          </div>
          <input
            type="number"
            [(ngModel)]="newGift.value"
            placeholder="Valor da Meta"
            class="w-full pl-9 pr-4 py-2.5 bg-[#fdfbf9] border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-[#8c6b5d] text-sm text-brand-dark placeholder-gray-400"
          />
        </div>

        <button
          (click)="saveGift()"
          class="w-full md:w-auto px-4 py-2.5 bg-[#8c6b5d] hover:bg-[#735548] text-white rounded-md shadow-sm transition-colors flex justify-center items-center"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            ></path>
          </svg>
        </button>
      </div>

      <!-- Segunda Linha: Descrição e Seleção do Arquivo de Imagem -->
      <div class="flex flex-col md:flex-row gap-4 items-start md:items-center pt-2">
        <input
          type="text"
          [(ngModel)]="newGift.description"
          placeholder="Descrição curta do presente"
          class="w-full md:flex-1 px-4 py-2 bg-[#fdfbf9] border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-[#8c6b5d] text-sm text-brand-dark placeholder-gray-400"
        />

        <!-- Input de Upload da Imagem -->
        <div class="w-full md:flex-1 flex flex-col gap-1">
          <input
            type="file"
            accept="image/*"
            (change)="onFileSelected($event)"
            class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-[#8c6b5d] file:text-white hover:file:bg-[#735548] cursor-pointer bg-[#fdfbf9] border border-gray-200 rounded-md py-1 px-2"
          />
        </div>
      </div>

      <!-- Preview da Imagem Selecionada antes de enviar -->
      <div *ngIf="imagePreview" class="flex items-center gap-3 pt-1">
        <span class="text-xs text-gray-500 font-medium">Pré-visualização:</span>
        <div class="w-16 h-16 rounded border border-gray-200 overflow-hidden bg-gray-50">
          <img [src]="imagePreview" class="w-full h-full object-cover" alt="Preview da imagem" />
        </div>
      </div>
    </div>

    <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-6">
      <div class="relative w-full md:w-96">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
        </div>
        <input
          type="text"
          placeholder="Buscar presente..."
          (input)="searchGift($event)"
          class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-md bg-[#f9f8f6] focus:outline-none focus:ring-1 focus:ring-[#8c6b5d] text-sm"
        />
      </div>

      <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
        <button
          (click)="filterByCategory('Todos')"
          [ngClass]="
            activeCategory === 'Todos'
              ? 'bg-[#8c6b5d] text-white border-transparent'
              : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'
          "
          class="px-4 py-1.5 text-sm rounded-md border shadow-sm transition"
        >
          Todos
        </button>

        <button
          (click)="filterByCategory('Casa')"
          [ngClass]="
            activeCategory === 'Casa'
              ? 'bg-[#8c6b5d] text-white border-transparent'
              : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'
          "
          class="px-4 py-1.5 text-sm rounded-md border shadow-sm transition"
        >
          Casa
        </button>

        <button
          (click)="filterByCategory('Viagem')"
          [ngClass]="
            activeCategory === 'Viagem'
              ? 'bg-[#8c6b5d] text-white border-transparent'
              : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'
          "
          class="px-4 py-1.5 text-sm rounded-md border shadow-sm transition"
        >
          Viagem
        </button>

        <button
          (click)="filterByCategory('Experiência')"
          [ngClass]="
            activeCategory === 'Experiência'
              ? 'bg-[#8c6b5d] text-white border-transparent'
              : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'
          "
          class="px-4 py-1.5 text-sm rounded-md border shadow-sm transition"
        >
          Experiência
        </button>

        <button
          (click)="filterByCategory('Eletrodoméstico')"
          [ngClass]="
            activeCategory === 'Eletrodoméstico'
              ? 'bg-[#8c6b5d] text-white border-transparent'
              : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'
          "
          class="px-4 py-1.5 text-sm rounded-md border shadow-sm transition"
        >
          Eletrodoméstico
        </button>
      </div>
    </div>

    <!-- Tabela Limpa (Vitrine) -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm whitespace-nowrap">
          <thead
            class="bg-[#f9f8f6] text-gray-500 border-b border-gray-200 uppercase text-xs tracking-wider"
          >
            <tr>
              <th class="px-6 py-4 font-medium">Nome do Presente</th>
              <th class="px-6 py-4 font-medium">Categoria</th>
              <th class="px-6 py-4 font-medium">Valor Unitário</th>
              <th class="px-6 py-4 font-medium">Arrecadação Total</th>
              <th class="px-6 py-4 font-medium text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr
              *ngFor="let gift of gifts"
              class="border-b border-gray-100 hover:bg-white/50 transition-colors"
            >
              <td class="py-4 px-6 text-sm text-gray-700">
                <div class="flex items-center gap-3">
                  <img
                    *ngIf="editingId !== gift.id"
                    [src]="
                      gift.imageUrl
                        ? 'https://api.marialauraepedro.com.br' + gift.imageUrl
                        : 'assets/images/placeholder.jpg'
                    "
                    class="w-10 h-10 rounded object-cover border border-gray-200"
                  />
                  <span *ngIf="editingId !== gift.id" class="font-medium">{{ gift.name }}</span>
                  <input
                    *ngIf="editingId === gift.id"
                    type="text"
                    [(ngModel)]="editedGift.name"
                    class="border border-[#e5dcd3] bg-[#fcf9f6] rounded px-3 py-1 w-full text-sm outline-none focus:border-[#a88b6d]"
                  />
                </div>
              </td>
              <td class="py-4 px-6 text-sm">
                <span
                  *ngIf="editingId !== gift.id"
                  class="px-3 py-1 bg-stone-100 text-[#8c6b5d] rounded-full text-xs font-semibold"
                  >{{ gift.type }}</span
                >
                <select
                  *ngIf="editingId === gift.id"
                  [(ngModel)]="editedGift.type"
                  class="border border-[#e5dcd3] bg-[#fcf9f6] rounded px-3 py-1 w-full text-sm outline-none focus:border-[#a88b6d]"
                >
                  <option value="VIAGEM">Viagem</option>
                  <option value="EXPERIÊNCIA">Experiência</option>
                  <option value="CASA">Casa</option>
                  <option value="ELETRODOMÉSTICO">Eletrodoméstico</option>
                </select>
              </td>
              <td class="py-4 px-6 text-sm text-gray-600 font-medium">
                <span *ngIf="editingId !== gift.id">R$ {{ gift.value | number: '1.2-2' }}</span>
                <input
                  *ngIf="editingId === gift.id"
                  type="number"
                  [(ngModel)]="editedGift.value"
                  class="border border-[#e5dcd3] bg-[#fcf9f6] rounded px-3 py-1 w-24 text-sm outline-none focus:border-[#a88b6d]"
                />
              </td>
              <td class="py-4 px-6 text-sm text-green-700 font-semibold">
                R$ {{ gift.collected | number: '1.2-2' }}
              </td>
              <td class="py-4 px-6 text-sm">
                <div *ngIf="editingId !== gift.id" class="flex gap-2 justify-center">
                  <button
                    (click)="startEditing(gift)"
                    class="flex items-center justify-center w-8 h-8 bg-[#f5ebe0] text-[#8b5a2b] hover:bg-[#e6d5c3] rounded transition-colors cursor-pointer"
                    title="Editar"
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
                      />
                    </svg>
                  </button>
                  <button
                    (click)="deleteEvent(gift)"
                    class="flex items-center justify-center w-8 h-8 bg-[#ffe4e1] text-[#cd5c5c] hover:bg-[#ffcccb] rounded transition-colors cursor-pointer"
                    title="Excluir"
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                      />
                    </svg>
                  </button>
                </div>
                <div *ngIf="editingId === gift.id" class="flex gap-2 justify-center">
                  <button
                    (click)="saveEdit()"
                    class="flex items-center justify-center w-8 h-8 text-green-600 bg-green-100 border border-green-200 hover:bg-green-200 rounded transition-colors cursor-pointer"
                    title="Salvar"
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M5 13l4 4L19 7"
                      ></path>
                    </svg>
                  </button>
                  <button
                    (click)="cancelEdit()"
                    class="flex items-center justify-center w-8 h-8 text-red-500 bg-red-50 border border-red-200 hover:bg-red-100 rounded cursor-pointer"
                    title="Cancelar"
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M6 18L18 6M6 6l12 12"
                      ></path>
                    </svg>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
