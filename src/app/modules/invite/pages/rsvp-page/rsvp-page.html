<div class="min-h-screen bg-[#fdf8f4] pt-28 pb-24 px-6">
  <div class="max-w-2xl mx-auto">
    <!-- Cabeçalho -->
    <div class="text-center mb-10">
      <h1 class="font-playfair text-4xl text-[#2c1f14] mb-3">Confirme sua Presença</h1>
      <p class="text-[#7a6259]">Digite seu nome abaixo para buscar seu convite.</p>
    </div>

    <!-- Barra de Pesquisa -->
    <div class="relative mb-8">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (input)="filterGuests()"
        placeholder="Digite seu nome (ex: João da Silva)"
        class="w-full px-5 py-4 bg-white border border-[#e8d9d3] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#8c6b5d] text-[#3b2a24] shadow-sm"
      />
    </div>

    <!-- Lista de Resultados (Sem a borda dupla) -->
    <div *ngIf="searchQuery.length >= 3" class="mb-6">
      <!-- Se encontrou convidados -->
      <div *ngIf="filteredGuests.length > 0; else noResults" class="flex flex-col gap-3">
        <div
          *ngFor="let guest of filteredGuests"
          class="flex items-center p-4 transition-colors rounded-xl border"
          [ngClass]="
            selectedGuests.has(guest.id!)
              ? 'border-[#8c6b5d] bg-[#8c6b5d]/5'
              : 'border-[#e8d9d3] bg-white'
          "
        >
          <!-- Checkbox -->
          <input
            type="checkbox"
            [checked]="selectedGuests.has(guest.id!)"
            (change)="toggleSelection(guest.id!)"
            [disabled]="guest.status === 'Confirmado'"
            class="w-5 h-5 text-[#8c6b5d] border-gray-300 rounded focus:ring-[#8c6b5d] cursor-pointer disabled:opacity-50"
          />

          <!-- Área do Nome Clicável -->
          <div
            class="ml-4 flex-1 flex flex-col cursor-pointer"
            (click)="guest.status !== 'Confirmado' && toggleSelection(guest.id!)"
          >
            <span
              class="text-[16px] font-medium transition-colors"
              [ngClass]="guest.status === 'Confirmado' ? 'text-gray-400' : 'text-[#2c1f14]'"
            >
              {{ guest.nome }}
            </span>

            <!-- Mensagem de Já Confirmado (Só aparece se o banco retornar que já está) -->
            <span
              *ngIf="guest.status === 'Confirmado'"
              class="text-xs text-green-600 font-semibold mt-0.5 flex items-center gap-1"
            >
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="3"
                  d="M5 13l4 4L19 7"
                ></path>
              </svg>
              Presença já confirmada
            </span>
          </div>
        </div>
      </div>

      <!-- Se não encontrou ninguém -->
      <ng-template #noResults>
        <div class="p-6 text-center text-[#7a6259]">Nenhum convidado encontrado com esse nome.</div>
      </ng-template>
    </div>

    <!-- Botão de Confirmar (Agora mostrando os nomes selecionados) -->
    <button
      *ngIf="selectedGuests.size > 0"
      (click)="confirmPresence()"
      class="w-full py-4 text-white text-lg font-medium rounded-xl transition-all shadow-sm hover:shadow-md"
      style="background: #8b5e52"
    >
      Confirmar Presença ({{ getSelectedNames() }})
    </button>

    <!-- Mensagem de Sucesso -->
    <div
      *ngIf="successMessage"
      class="mt-6 p-4 bg-green-50 border border-green-200 rounded-xl text-center text-green-700"
    >
      Sua presença foi confirmada com sucesso! Mal podemos esperar para celebrar com você.
    </div>
  </div>
</div>
